name: Update Data

on:
  schedule:
    - cron: "0 12 * * *"
  push:
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  update-data:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install requests
        run: pip install requests

      - name: Check refresh safeguards
        run: python -m unittest discover -s tests

      - name: Run update script
        run: python scripts/update_data.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.csv
          git diff --cached --quiet || git commit -m "Auto update data"
          git push
